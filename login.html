<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login | Operational Excellence Portal</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Operational Excellence Portal">
        <meta name="keywords" content="Lean Six Sigma, Dashboard, Green Belt">
        <meta name="author" content="Mark Daniel Tabor">
        <link rel="icon" href="/assets/images/logo2.png"/>
        <link href="./css/global.css" rel="stylesheet"/>
        <link href="./css/login.css" rel="stylesheet"/>
    </head>

    <body>
        <main>
            <header>
                <button onclick="window.location.href='./index.html'">&#10094; Back to Home</button>
                <div class="header">
                    <h1>Welcome To</h1>
                    <h2>Operational Excellence Portal</h2>
                    <p>Login</p>
                </div>
            </header> 

            <section>
                <div class="login">
                    <form class="loginform" id="loginform" action="/login" method="POST">
                        <fieldset>
                            <label for="badgeid">BadgeID <input type="text" name="badgeid" required></label>
                            <label for="password">Password <input type="password" name="password" required></label>
                        </fieldset>

                        <fieldset>
                            <button>Login</button>
                        </fieldset>

                        
                        <div id="login-error-msg" style="color: red; margin-top: 10px; font-weight: bold; text-align: center;"></div>
                    </form>
                </div>
            </section>
        </main>

        <script src="./js/login.js"></script>
        <script src="./js/global.js"></script>
    </body>

</html>
